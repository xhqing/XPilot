  <text x="228" y="92" font-size="52" font-weight="700" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">NetOpsAgent</text>
  <text x="230" y="130" font-size="21" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">Network Operations Agent · Hermes</text>
